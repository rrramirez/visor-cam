[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.92"

[workspace.dependencies]
visor-core = { path = "crates/visor-core" }
visor-capture = { path = "crates/visor-capture" }
visor-media = { path = "crates/visor-media" }
visor-recorder = { path = "crates/visor-recorder" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive"] }
ffmpeg-next = "9.0.0"

[profile.release]
# Smaller app bundle: drop debug info and let LTO drop unused code. Symbol
# names stay so panic backtraces in the log name functions.
strip = "debuginfo"
lto = "thin"
