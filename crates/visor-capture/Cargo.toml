[package]
name = "visor-capture"
description = "Screen, audio and camera capture backends for Visor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
visor-core.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
cpal = "0.18"
ffmpeg-next.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11.0.0", features = ["macos_15_0"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSGraphics"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Graphics",
    "Graphics_Capture",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
windows-capture = "2.0.1"
wasapi = "0.26"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc = "0.2"
# The ScreenCast portal client runs on a blocking async-io executor on its own
# thread, so tokio is not pulled into the app.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
futures-lite = "2"
pipewire = "0.10"
