# Builds Visor for Windows and packages the installer (Visor-Setup-<version>.exe).
# Runs on demand (Actions › Windows › Run workflow) and for version tags.
name: Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
      # Link the C runtime into visor.exe so it doesn't need the VC++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # A minimal FFmpeg (only what Visor uses), built once per recipe change.
      - name: FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\ffmpeg-min
          key: ffmpeg-min-windows-${{ hashFiles('scripts/build-ffmpeg-windows.sh') }}

      - name: MSYS2 (to build FFmpeg)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            make diffutils
            mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-x264 mingw-w64-x86_64-libvpx mingw-w64-x86_64-opus
            mingw-w64-x86_64-aom mingw-w64-x86_64-ffnvcodec-headers
            mingw-w64-x86_64-amf-headers

      - name: Build minimal FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: scripts/build-ffmpeg-windows.sh /c/ffmpeg-min

      - name: Use FFmpeg
        shell: pwsh
        run: |
          "FFMPEG_DIR=C:\ffmpeg-min" >> $env:GITHUB_ENV
          "C:\ffmpeg-min\bin" >> $env:GITHUB_PATH
          # bindgen (ffmpeg-sys) needs libclang; the runner image ships LLVM.
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Test
        run: cargo test --workspace --no-fail-fast

      - name: Build
        run: cargo build --release -p visor

      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $stage = "dist\windows\Visor"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target\release\visor.exe $stage
          Copy-Item C:\ffmpeg-min\bin\*.dll $stage
          Copy-Item LICENSE "$stage\LICENSE.txt"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\$stage" packaging\windows\visor.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist\windows\*.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Visor-Windows
          path: dist/windows/Visor-Setup-*.exe
          if-no-files-found: error
